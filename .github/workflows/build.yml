name: Node.js CI

on: [push]

permissions:
  id-token: write # Required for OIDC trusted publishing
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun lint

  publish:
    needs: [build, test, lint]
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Publish whenever npm does not have this version yet. Asking the registry, rather than
      # looking for a version change in the pushed commits, also works when the release commit
      # reached the remote before its tag did.
      - name: Check if this version is already on npm
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@elumixor/nitro-bot@$VERSION" version >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - run: bun install
        if: steps.check.outputs.changed == 'true'

      - run: bun run build
        if: steps.check.outputs.changed == 'true'

      - run: npm publish --access public
        if: steps.check.outputs.changed == 'true'

      - run: 'echo "This version is already on npm, skipping publish"'
        if: steps.check.outputs.changed == 'false'
